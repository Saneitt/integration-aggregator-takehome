apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "integration-aggregator.fullname" . }}-test-readyz"
  labels:
    {{- include "integration-aggregator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ .Values.test.image | quote }}
      command: ["curl"]
      args:
        - --fail
        - --silent
        - --show-error
        - "http://{{ include "integration-aggregator.fullname" . }}:{{ .Values.service.port }}/readyz"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
